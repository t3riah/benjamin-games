    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #020205; color: #f3f4f6; user-select: none; touch-action: manipulation; }
        .font-orbitron { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.05em; }
        .glass-panel { background: rgba(10, 10, 22, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.3); }
        #game-canvas { touch-action: none; width: 100%; max-width: 340px; height: auto; }
        header a, header .rounded-full { min-height: 44px; display: inline-flex; align-items: center; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-black">

    <!-- Top Navigation -->
    <header class="w-full glass-panel sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-orbitron font-black text-slate-950 text-base shadow-md">
                🍬
            </div>
            <div>
                <h1 class="font-orbitron font-black text-sm tracking-wider text-pink-300">GABRIELLA'S GUMDROPS</h1>
                <p class="text-[10px] text-pink-200/70 font-medium">No13thfloor Harmonic Crystal Catcher</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="px-3 py-1 rounded-full bg-slate-950/90 border border-pink-500/30 text-xs font-mono text-pink-300">
                Crystals: <span id="hud-score" class="font-bold text-amber-300">0</span>
                <span class="text-slate-400">· Best: <span id="hud-best" class="font-bold text-pink-300">0</span></span>
            </div>
            <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-pink-300 border border-pink-500/30 font-bold text-xs">Hub</a>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        <div class="glass-panel p-4 rounded-3xl shadow-2xl flex flex-col items-center space-y-3 border border-pink-500/30 relative max-w-full">

            <canvas id="game-canvas" width="340" height="420" class="rounded-2xl bg-slate-950 block border border-pink-500/20"></canvas>

            <div class="text-center text-xs text-slate-300">
                Use <b class="text-pink-300">Arrow Keys</b> or drag to catch falling vibrational gumdrops!
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-[11px] text-slate-500 font-mono">
        games.no13thfloor.org &bull; Harmonic Crystal Labs
    </footer>

    <!-- Game Script -->
    <script>
        class GumdropsGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.score = 0;
                this.best = 0;
                try { this.best = parseInt(localStorage.getItem('gumdropsBestV1') || '0', 10) || 0; } catch (e) { this.best = 0; }
                const bestEl = document.getElementById('hud-best');
                if (bestEl) bestEl.innerText = this.best;
                this.basket = { x: 130, y: 380, w: 80, h: 16, speed: 7 };
                this.drops = [];
                this.keys = {};
                this.isPlaying = true;

                this.bindEvents();
                this.loop();
            }

            bindEvents() {
                window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
                window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

                const moveTo = (clientX) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (clientX - rect.left) * (this.canvas.width / rect.width);
                    this.basket.x = Math.max(0, Math.min(this.canvas.width - this.basket.w, x - this.basket.w / 2));
                };
                this.canvas.addEventListener('touchstart', (e) => { moveTo(e.touches[0].clientX); }, { passive: true });
                this.canvas.addEventListener('touchmove', (e) => { moveTo(e.touches[0].clientX); }, { passive: true });
                this.canvas.addEventListener('mousemove', (e) => { moveTo(e.clientX); });
            }

            spawnDrop() {
                if (Math.random() < 0.04) {
                    const types = [
                        { color: '#f43f5e', points: 10, symbol: '🔴' },
                        { color: '#ec4899', points: 20, symbol: '🟣' },
                        { color: '#fbbf24', points: 50, symbol: '⭐' }
                    ];
                    const t = types[Math.floor(Math.random() * types.length)];
                    this.drops.push({
                        x: Math.random() * (this.canvas.width - 24),
                        y: -20,
                        size: 20,
                        speed: 2 + Math.random() * 2.5,
                        ...t
                    });
                }
            }

            update() {
                if (!this.isPlaying) return;

                if (this.keys['ArrowLeft'] || this.keys['KeyA']) {
                    this.basket.x = Math.max(0, this.basket.x - this.basket.speed);
                }
                if (this.keys['ArrowRight'] || this.keys['KeyD']) {
                    this.basket.x = Math.min(this.canvas.width - this.basket.w, this.basket.x + this.basket.speed);
                }

                this.spawnDrop();

                for (let i = this.drops.length - 1; i >= 0; i--) {
                    let d = this.drops[i];
                    d.y += d.speed;

                    // Collision with basket
                    if (
                        d.y + d.size >= this.basket.y &&
                        d.x + d.size >= this.basket.x &&
                        d.x <= this.basket.x + this.basket.w
                    ) {
                        this.score += d.points;
                        document.getElementById('hud-score').innerText = this.score;
                        if (this.score > this.best) {
                            this.best = this.score;
                            document.getElementById('hud-best').innerText = this.best;
                            try { localStorage.setItem('gumdropsBestV1', String(this.best)); } catch (e) {}
                        }
                        this.drops.splice(i, 1);
                    } else if (d.y > this.canvas.height) {
                        this.drops.splice(i, 1);
                    }
                }
            }

            draw() {
                this.ctx.fillStyle = '#020205';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw Basket (Resonance Collector)
                this.ctx.fillStyle = '#a855f7';
                this.ctx.shadowColor = '#c084fc';
                this.ctx.shadowBlur = 12;
                this.ctx.fillRect(this.basket.x, this.basket.y, this.basket.w, this.basket.h);
                this.ctx.shadowBlur = 0;

                // Draw Drops
                this.drops.forEach(d => {
                    this.ctx.font = '18px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(d.symbol, d.x + d.size / 2, d.y + d.size / 2);
                });
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.onload = () => {
            window.gumdropsGame = new GumdropsGame();
        };
    </script>
</body>
</html>
