    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #020205; color: #f3f4f6; user-select: none; touch-action: manipulation; }
        .font-orbitron { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.05em; }
        .glass-panel { background: rgba(10, 10, 22, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.3); }
        .grid-cell { width: 34px; height: 34px; transition: all 0.2s ease; }
        @media (min-width: 640px) {
            .grid-cell { width: 48px; height: 48px; }
        }
        header a, header .rounded-full, #btn-reset { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Top Navigation -->
    <header class="w-full glass-panel sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-orbitron font-black text-slate-950 text-base shadow-md">
                ⚓
            </div>
            <div>
                <h1 class="font-orbitron font-black text-sm tracking-wider text-cyan-300">BENJAMIN'S BATTLESHIP</h1>
                <p class="text-[10px] text-cyan-200/70 font-medium">No13thfloor Void Fleet Tactical</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="px-3 py-1 rounded-full bg-slate-950/90 border border-cyan-500/30 text-xs font-mono text-cyan-400">
                Status: <span id="game-status" class="font-bold text-amber-300">Targeting Phase</span>
            </div>
            <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-cyan-500/30 font-bold text-xs">Hub</a>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-3xl shadow-2xl max-w-xl w-full flex flex-col items-center space-y-5 border border-cyan-500/30">

            <div class="text-center space-y-1">
                <h2 class="font-orbitron font-bold text-lg text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-amber-300">
                    VOID SECTOR RADAR GRID
                </h2>
                <p class="text-xs text-slate-300">Scan enemy void coordinates and deploy harmonic resonance torpedoes!</p>
            </div>

            <!-- Enemy Grid (Interactive Target Board) -->
            <div class="space-y-2">
                <div class="text-[11px] font-orbitron text-cyan-400 font-bold flex justify-between">
                    <span>ENEMY SECTOR (CLICK TO STRIKE)</span>
                    <span id="score-counter">Hits: 0 / 12</span>
                </div>
                <div id="enemy-grid" class="grid grid-cols-8 gap-1 bg-slate-950 p-3 rounded-2xl border border-cyan-500/30 shadow-inner">
                    <!-- Dynamic Grid Cells -->
                </div>
            </div>

            <div class="flex items-center justify-between w-full pt-2">
                <button id="btn-reset" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 text-cyan-300 font-orbitron text-xs font-bold transition-all">
                    Re-Calibrate Grid
                </button>
                <span class="text-[11px] text-slate-400 font-mono">Quantum Sonar Active</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-[11px] text-slate-500 font-mono">
        games.no13thfloor.org &bull; Tactical Fleet Command
    </footer>

    <!-- Game Script -->
    <script>
        class BattleshipGame {
            constructor() {
                this.size = 8;
                this.hits = 0;
                this.won = false;
                this.totalShips = 12; // 4 ships: sizes 4, 3, 3, 2
                this.board = Array(this.size).fill(null).map(() => Array(this.size).fill(0)); // 0: empty, 1: ship, 2: hit, 3: miss
                this.initShips();
                this.renderGrid();
            }

            initShips() {
                // Place ships randomly (1 ship of size 4, 2 of size 3, 1 of size 2)
                const shipSizes = [4, 3, 3, 2];
                this.board = Array(this.size).fill(null).map(() => Array(this.size).fill(0));

                for (let size of shipSizes) {
                    let placed = false;
                    while (!placed) {
                        const horizontal = Math.random() > 0.5;
                        const r = Math.floor(Math.random() * (horizontal ? this.size : this.size - size + 1));
                        const c = Math.floor(Math.random() * (horizontal ? this.size - size + 1 : this.size));

                        let canPlace = true;
                        for (let i = 0; i < size; i++) {
                            const voidR = horizontal ? r : r + i;
                            const voidC = horizontal ? c + i : c;
                            if (this.board[voidR][voidC] === 1) canPlace = false;
                        }

                        if (canPlace) {
                            for (let i = 0; i < size; i++) {
                                const voidR = horizontal ? r : r + i;
                                const voidC = horizontal ? c + i : c;
                                this.board[voidR][voidC] = 1;
                            }
                            placed = true;
                        }
                    }
                }
            }

            renderGrid() {
                const gridEl = document.getElementById('enemy-grid');
                gridEl.innerHTML = '';

                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const cell = document.createElement('button');
                        cell.className = 'grid-cell rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 flex items-center justify-center font-bold text-xs text-slate-400';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.setAttribute('aria-label', `Sector row ${r + 1} column ${c + 1}`);

                        const val = this.board[r][c];
                        if (val === 2) {
                            cell.className += ' bg-amber-500/20 border-amber-400 text-amber-300';
                            cell.innerText = '💥';
                        } else if (val === 3) {
                            cell.className += ' bg-slate-900 border-slate-700 text-slate-600';
                            cell.innerText = '•';
                        }

                        cell.onclick = () => this.fireTorpedo(r, c, cell);
                        gridEl.appendChild(cell);
                    }
                }
            }

            fireTorpedo(r, c, cellEl) {
                if (this.won) return;
                const val = this.board[r][c];
                if (val === 2 || val === 3) return; // already struck

                if (val === 1) {
                    this.board[r][c] = 2;
                    this.hits++;
                    cellEl.className = 'grid-cell rounded-lg bg-amber-500/30 border border-amber-400 flex items-center justify-center text-sm';
                    cellEl.innerText = '💥';
                    document.getElementById('score-counter').innerText = `Hits: ${this.hits} / ${this.totalShips}`;

                    if (this.hits >= this.totalShips) {
                        this.won = true;
                        document.getElementById('game-status').innerText = 'Sector Cleared!';
                        document.getElementById('game-status').className = 'font-bold text-emerald-400';
                    }
                } else {
                    this.board[r][c] = 3;
                    cellEl.className = 'grid-cell rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600';
                    cellEl.innerText = '•';
                }
            }
        }

        window.onload = () => {
            let game = new BattleshipGame();
            window.battleshipGame = game;
            document.getElementById('btn-reset').onclick = () => {
                game = new BattleshipGame();
                window.battleshipGame = game;
                document.getElementById('game-status').innerText = 'Targeting Phase';
                document.getElementById('game-status').className = 'font-bold text-amber-300';
                document.getElementById('score-counter').innerText = 'Hits: 0 / 12';
            };
        };
    </script>
</body>
</html>
